<style>
:root {
  --bg: #fff8ef;
  --sf: #fffdf9;
  --berry: #c91f59;
  --berry-hover: #a91849;
  --plum: #32164f;
  --amber: #f5a623;
  --mint: #14866d;
  --ink: #25151e;
  --bd: #f0dfd0;
  --mut: #78646e;
  --tag-bg: #fff0f4;
  --tag-fg: #9b244c;
  --note-bg: #fff2e3;
  --sec-bg: #f7efe8;
  --sec-fg: #624b59;
  --radius: 20px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1e1619;
    --sf: #2a2024;
    --ink: #fffbf5;
    --bd: #3d3036;
    --mut: #b9a8b0;
    --tag-bg: #4b2339;
    --tag-fg: #ffd2e2;
    --note-bg: #35272d;
    --sec-bg: #3b2d38;
    --sec-fg: #f0dce7;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: radial-gradient(ellipse at 8% 0%, rgba(255, 216, 226, .34), transparent 28%), var(--bg);
  color: var(--ink);
  font: 16px/1.5 "Plus Jakarta Sans", Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
}
h1, h2, h3, h4 { font-family: Fraunces, Georgia, serif; margin: .2em 0; letter-spacing: -.035em; }
h2 { font-size: clamp(25px, 5vw, 36px); }
button, input, select, textarea { font: inherit; color: inherit; }
button {
  min-height: 44px;
  padding: 0 16px;
  border-radius: 13px;
  border: 1px solid var(--bd);
  background: var(--sf);
  cursor: pointer;
  transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
}
button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 7px 18px rgba(74, 32, 48, .08); }
button:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
  outline: 3px solid var(--amber);
  outline-offset: 2px;
}
.pri {
  background: var(--berry);
  color: #fff;
  border-color: var(--berry);
  font-weight: 700;
  box-shadow: 0 8px 18px rgba(201, 31, 89, .18);
}
.pri:hover:not(:disabled) { background: var(--berry-hover); border-color: var(--berry-hover); }
body.ws .pri { background: var(--plum); border-color: var(--plum); box-shadow: 0 8px 18px rgba(50, 22, 79, .22); }
body.ws .pri:hover:not(:disabled) { background: #230e39; border-color: #230e39; }
input, select, textarea {
  min-height: 44px;
  padding: 8px 12px;
  border: 1px solid var(--bd);
  border-radius: 12px;
  background: var(--sf);
  width: 100%;
}
label { display: block; font-size: 13px; font-weight: 700; margin: 10px 0 4px; color: var(--mut); }

.topline {
  background: #2b123e;
  color: #ffe7d5;
  text-align: center;
  padding: 7px 12px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .09em;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.topline span { color: #ffb3cb; }
.topline button {
  min-height: 24px;
  padding: 0 10px;
  font-size: 10px;
  border-radius: 999px;
  background: #ffcc8b;
  color: #2b123e;
  border: 0;
  font-weight: 900;
}

header {
  position: sticky;
  top: 0;
  z-index: 5;
  backdrop-filter: blur(18px);
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  padding: 10px max(16px, calc((100vw - 1160px) / 2));
  border-bottom: 1px solid rgba(201, 31, 89, .12);
  box-shadow: 0 8px 24px rgba(43, 18, 62, .04);
}
header .row:first-child { min-height: 42px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sp { justify-content: space-between; }
.logo {
  font-family: Fraunces, Georgia, serif;
  font-weight: 800;
  font-size: 25px;
  letter-spacing: -.06em;
  color: var(--berry);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}
.logo:before {
  content: "✦";
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 11px;
  background: var(--berry);
  color: #fff;
  font-size: 17px;
  box-shadow: 0 6px 16px rgba(201, 31, 89, .22);
}
body.ws .logo { color: var(--plum); }
body.ws .logo:before { background: var(--plum); box-shadow: 0 6px 16px rgba(50, 22, 79, .25); }

nav {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 10px 0 3px;
  scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }
nav button {
  white-space: nowrap;
  border-color: transparent;
  background: transparent;
  font-size: 14px;
  padding: 0 13px;
}
nav button[aria-current=true] {
  background: var(--plum);
  color: #fff;
  box-shadow: 0 6px 16px rgba(50, 22, 79, .15);
}

main { max-width: 1160px; margin: 0 auto; padding: 22px 18px 40px; }

.hero {
  border-radius: 28px;
  min-height: 340px;
  padding: clamp(25px, 5vw, 54px);
  margin-bottom: 24px;
  background: linear-gradient(115deg, #2c1241 0%, #4a1a58 53%, #9c2459 100%);
  color: #fffbf5;
  border: 1px solid rgba(255, 255, 255, .1);
  box-shadow: 0 18px 42px rgba(50, 22, 79, .16);
  position: relative;
  overflow: hidden;
  isolation: isolate;
}
.hero:before {
  content: "THE SWEET SIDE OF EVERYDAY";
  display: block;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .2em;
  color: #ffd8a7;
  margin-bottom: 18px;
}
.hero h1 { font-size: clamp(36px, 7vw, 66px); max-width: 8.2em; line-height: .99; font-weight: 700; margin: 0 0 18px; }
.hero p { font-size: clamp(15px, 2vw, 18px); max-width: 31em; color: #f5e9f4; line-height: 1.65; }
.hero:after {
  content: "";
  position: absolute;
  right: 2%;
  bottom: -80px;
  width: 310px;
  height: 310px;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 35%, #fff4cf 0 7%, #ffb0c8 8% 18%, #e54c88 19% 34%, #a62768 35% 52%, #6a1b57 53% 70%, transparent 71%);
  border: 14px solid rgba(255, 255, 255, .08);
  box-shadow: 0 0 0 20px rgba(255, 255, 255, .04), 0 20px 60px rgba(22, 5, 28, .35);
  transform: rotate(-18deg);
  z-index: -1;
}
.hero .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; position: relative; z-index: 1; }
.hero .hero-actions button { min-height: 48px; }
.hero .hero-actions .pri { background: #ffcc8b; color: #32164f; border-color: #ffcc8b; box-shadow: 0 12px 24px rgba(18, 5, 30, .2); }
.hero .hero-actions .pri:hover:not(:disabled) { background: #ffdda9; border-color: #ffdda9; }
.hero .hero-actions button:not(.pri) { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .35); color: #fff; }

.promise-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0 24px; }
.promise {
  background: var(--sf);
  border: 1px solid var(--bd);
  border-radius: 15px;
  padding: 13px;
  display: flex;
  gap: 10px;
  align-items: center;
  min-width: 0;
}
.promise .pi {
  width: 34px;
  height: 34px;
  flex: 0 0 34px;
  border-radius: 11px;
  background: var(--tag-bg);
  color: var(--tag-fg);
  display: grid;
  place-items: center;
  font-size: 17px;
}
.promise b { display: block; font-size: 12px; }
.promise small { display: block; color: var(--mut); font-size: 11px; line-height: 1.35; margin-top: 2px; }

.catalog-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin: 24px 2px 12px; }
.catalog-head h2 { font-size: clamp(25px, 5vw, 34px); margin: 0; }
.catalog-head p { font-size: 13px; color: var(--mut); margin: 4px 0 0; }
.catalog-count { background: var(--tag-bg); color: var(--tag-fg); border-radius: 999px; padding: 7px 11px; font-size: 12px; font-weight: 800; white-space: nowrap; }

#cat { border: 0; background: transparent; box-shadow: none; padding: 0; margin: 0 0 18px; scroll-margin-top: 130px; }
#cat > .row:first-child { align-items: end; }
#cat .row:last-child { gap: 8px; }
#cat .row:last-child button { border-radius: 999px; padding: 0 17px; min-height: 39px; font-size: 13px; font-weight: 700; }
#cat .row:last-child button.pri { background: var(--plum); border-color: var(--plum); color: #fff; }
#cat .row:last-child button:not(.pri) { background: var(--sf); border-color: var(--bd); color: var(--ink); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 225px), 1fr)); gap: 17px; }
.card {
  position: relative;
  background: var(--sf);
  border: 1px solid var(--bd);
  border-radius: 20px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 6px 22px rgba(75, 36, 48, .04);
  transition: transform .2s ease, box-shadow .2s ease;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 16px 32px rgba(75, 36, 48, .1); }
.card .img { height: 170px; display: grid; place-items: center; position: relative; overflow: hidden; isolation: isolate; }
.card .img:after { content: ""; position: absolute; width: 120px; height: 120px; border: 1px dashed rgba(255, 255, 255, .5); border-radius: 50%; transform: rotate(-18deg); }
.card .img svg { transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
.card:hover .img svg { transform: scale(1.08) rotate(-3deg); }
.card-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(43, 18, 62, .85);
  color: #ffcc8b;
  font-size: 10px;
  font-weight: 800;
  padding: 4px 9px;
  border-radius: 999px;
  letter-spacing: .04em;
  z-index: 2;
}
.card .b { padding: 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card h3 { font-size: 18px; line-height: 1.18; }
.card .b > small:first-child { color: var(--mut); letter-spacing: .08em; font-size: 11px; text-transform: uppercase; font-weight: 800; }
.card .b > b { font-size: 21px; color: var(--berry); letter-spacing: -.04em; }
body.ws .card .b > b { color: var(--plum); }
.card .b button { margin-top: auto; font-weight: 800; }
.card .b > small.stockline { display: flex; align-items: center; gap: 6px; }
.stockline:before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.margin-pill {
  background: color-mix(in srgb, var(--mint) 12%, transparent);
  color: var(--mint);
  border: 1px solid color-mix(in srgb, var(--mint) 30%, transparent);
  border-radius: 10px;
  padding: 6px 9px;
  font-size: 11px;
  font-weight: 700;
}

.tag { border-radius: 999px; background: var(--tag-bg); color: var(--tag-fg); padding: 3px 9px; font-size: 11px; font-weight: 700; display: inline-block; margin: 0 3px 3px 0; }
.ok { color: var(--mint); font-weight: 700; }
.warn { color: var(--amber); font-weight: 700; }
.bad { color: var(--berry); font-weight: 700; }

.panel { background: var(--sf); border: 1px solid var(--bd); border-radius: 20px; box-shadow: 0 5px 20px rgba(75, 36, 48, .03); padding: 18px; margin-bottom: 14px; }
.note { border-left: 4px solid var(--berry); border-radius: 0 14px 14px 0; padding: 10px 14px; background: var(--note-bg); margin: 12px 0; font-size: 14px; }
.bar { height: 14px; background: var(--bd); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--berry); transition: width .25s; }
.bar.mint i { background: var(--mint); }
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px 8px; border-bottom: 1px solid var(--bd); text-align: left; white-space: nowrap; }

.pass { max-width: 340px; margin: 0 auto 12px; text-align: center; }
.qr { width: 220px; height: 220px; margin: 12px auto; background: #fff; padding: 10px; border-radius: 12px; border: 1px solid var(--bd); }
.qr svg { width: 100%; height: 100%; }
.sr { position: absolute; left: -9999px; }
.stat { flex: 1 1 145px; border-radius: 16px; }
.stat b { font-size: 22px; display: block; margin-top: 4px; }

.toast {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  max-width: 540px;
  margin: 0 auto;
  background: var(--ink);
  color: var(--bg);
  padding: 13px 16px;
  border-radius: 16px;
  box-shadow: 0 14px 36px rgba(0, 0, 0, .25);
  z-index: 25;
  font-weight: 600;
}
.toast.err { background: #9b1643; color: #fff; border: 1px solid rgba(255, 255, 255, .2); }
.skip { position: absolute; left: -999px; top: 0; background: var(--ink); color: var(--bg); padding: 8px; z-index: 30; }
.skip:focus { left: 8px; }

.empty-products { grid-column: 1 / -1; text-align: center; padding: 34px 18px; background: var(--sf); border: 1px dashed var(--bd); border-radius: 20px; }
.empty-products .empty-icon { font-size: 36px; margin-bottom: 8px; }
.empty-products h3 { font-size: 25px; }
.empty-products p { color: var(--mut); max-width: 28em; margin: 8px auto 16px; }

#quickcart { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 8; pointer-events: none; }
#quickcart .quickcart-inner {
  pointer-events: auto;
  max-width: 580px;
  margin: 0 auto;
  background: #2c1241;
  color: #fff;
  border: 1px solid rgba(255, 255, 255, .15);
  border-radius: 18px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  box-shadow: 0 16px 40px rgba(28, 9, 43, .35);
}
#quickcart .qc-label { font-size: 11px; color: #e9d9ee; display: block; }
#quickcart .qc-total { font-weight: 900; font-size: 17px; display: block; }
#quickcart button { background: #ffcc8b; color: #32164f; border: 0; font-weight: 900; min-height: 43px; border-radius: 12px; white-space: nowrap; }
body:has(#quickcart .quickcart-inner) footer { padding-bottom: 84px; }

footer { color: var(--mut); }
footer > div { max-width: 1160px; margin: 0 auto; padding: 30px 18px; border-top: 1px solid var(--bd); }
footer small { display: block; margin-top: 18px; }

/* Admin Product Studio */
.admin-products { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 330px), 1fr)); gap: 14px; }
.admin-product { background: var(--sf); border: 1px solid var(--bd); border-radius: 20px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.admin-product-head { display: flex; align-items: center; gap: 12px; }
.admin-product-preview { width: 78px; height: 78px; border-radius: 15px; object-fit: cover; background: var(--tag-bg); flex: 0 0 78px; }
.admin-product-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.admin-product-fields .wide { grid-column: 1 / -1; }
.admin-product-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.admin-product-actions button { flex: 1 1 110px; }
.admin-photo-tools { display: grid; gap: 8px; }
.admin-photo-tools input[type=file] { font-size: 12px; padding: 8px; }

/* Account Creation & Auth */
.auth-wrap { max-width: 560px; margin: 0 auto; }
.auth-intro { padding: 4px 4px 16px; }
.auth-eyebrow { font-size: 11px; font-weight: 900; letter-spacing: .14em; color: var(--berry); }
.auth-intro h2 { margin: 7px 0; }
.auth-intro p, .auth-muted, .auth-email { color: var(--mut); }
.auth-panel { padding: clamp(16px, 4vw, 26px); border-radius: 24px; }
.auth-fields { display: grid; gap: 2px; }
.auth-panel input { border-radius: 13px; min-height: 49px; }
.auth-pw { display: flex; gap: 8px; }
.auth-pw input { flex: 1; min-width: 0; }
.auth-pw button { min-height: 49px; padding: 0 13px; }
.auth-meter { height: 6px; background: var(--bd); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.auth-meter span { display: block; height: 100%; width: 0; background: var(--berry); transition: width .2s, background .2s; }
.auth-muted { display: block; font-size: 12px; margin-top: 6px; }
.auth-consent { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.45; margin: 16px 0; color: var(--mut); font-weight: 400; }
.auth-consent input { width: 20px; height: 20px; min-height: 20px; flex: 0 0 20px; margin-top: 2px; accent-color: var(--berry); }
.auth-consent a, .auth-switch button { color: var(--berry); font-weight: 800; }
.auth-actions { display: grid; gap: 9px; margin-top: 18px; }
.auth-actions button { width: 100%; min-height: 49px; }
.auth-switch { text-align: center; font-size: 14px; margin: 17px 0 0; }
.auth-switch button { border: 0; background: transparent; padding: 4px 8px; min-height: 36px; box-shadow: none; }
.auth-security { background: var(--sec-bg); color: var(--sec-fg); border-radius: 13px; padding: 11px 13px; font-size: 12px; margin-top: 15px; line-height: 1.5; }
.auth-name { font-size: 23px; font-weight: 900; letter-spacing: -.04em; }
.auth-email { overflow-wrap: anywhere; }
.auth-actions button:not(.pri) { background: transparent; }

/* Modal Confirmation & Perk Dialogs */
dialog.sv-dialog {
  border: 1px solid var(--bd);
  border-radius: 24px;
  background: var(--sf);
  color: var(--ink);
  padding: 24px;
  max-width: 420px;
  width: calc(100% - 28px);
  box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
}
dialog.sv-dialog::backdrop { background: rgba(20, 10, 26, .6); backdrop-filter: blur(5px); }

.perk-wheel {
  width: 150px;
  height: 150px;
  margin: 14px auto;
  border-radius: 50%;
  background: conic-gradient(#c91f59 0deg 90deg, #32164f 90deg 180deg, #f5a623 180deg 270deg, #14866d 270deg 360deg);
  display: grid;
  place-items: center;
  border: 6px solid #fff;
  box-shadow: 0 10px 26px rgba(50, 22, 79, .22);
  transition: transform 1.6s cubic-bezier(.15, .85, .25, 1);
}
.perk-wheel span {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #fff;
  color: #32164f;
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 18px;
}

@media (min-width: 520px) {
  .auth-fields { grid-template-columns: 1fr 1fr; gap: 12px; }
  .auth-fields > div { min-width: 0; }
}
@media (min-width: 760px) {
  .hero { display: flex; flex-direction: column; justify-content: center; }
  .hero:after { width: 330px; height: 330px; right: 5%; bottom: -105px; }
}
@media (max-width: 650px) {
  .topline { font-size: 10px; letter-spacing: .05em; }
  header { padding: 8px 12px; }
  .logo { font-size: 21px; }
  .logo:before { width: 27px; height: 27px; }
  main { padding: 14px 12px 28px; }
  .hero { min-height: 300px; padding: 26px 20px; border-radius: 23px; }
  .hero h1 { max-width: 7.8em; font-size: clamp(34px, 10vw, 48px); }
  .hero:after { width: 175px; height: 175px; right: -42px; bottom: -45px; border-width: 10px; }
  .promise-strip { grid-template-columns: 1fr; gap: 8px; margin: 14px 0 20px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .card .img { height: 130px; }
  .card .b { padding: 11px; }
  .card h3 { font-size: 16px; }
  .card .b > b { font-size: 18px; }
  .panel { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *:before, *:after { transition: none !important; scroll-behavior: auto !important; }
}
@media print {
  header, nav, footer, .topline, #quickcart, #toast, .noprint { display: none !important; }
}

const rateLimits = {};
function checkRateLimit(bucket, maxAttempts = 5, windowMs = 60000) {
  const now = Date.now();
  const entry = rateLimits[bucket] || { count: 0, resetAt: now + windowMs, lockUntil: 0 };
  if (now < entry.lockUntil) {
    const secs = Math.ceil((entry.lockUntil - now) / 1000);
    return `Too many attempts. Please wait ${secs}s before trying again.`;
  }
  if (now > entry.resetAt) {
    entry.count = 0;
    entry.resetAt = now + windowMs;
  }
  entry.count++;
  if (entry.count > maxAttempts) {
    entry.lockUntil = now + windowMs;
    rateLimits[bucket] = entry;
    return `Rate limit reached. Locked for ${Math.ceil(windowMs / 1000)}s for your security.`;
  }
  rateLimits[bucket] = entry;
  return null;
}
function resetRateLimit(bucket) { delete rateLimits[bucket]; }

function price(cart, mode) {
  const S = st.S;
  const L = [];
  let u = 0;
  for (const it of cart) {
    if (it.k === 'p') {
      const p = st.P.find(x => x.sku === it.sku);
      if (!p) continue;
      if (mode === 'retail') {
        u += it.qty;
        L.push({ it, name: p.name, desc: it.qty + ' × ' + K(p.price), base: p.price * it.qty, elig: true });
      } else {
        L.push({
          it,
          name: p.name,
          desc: it.qty + ' carton(s) × ' + p.carton + ' units @ ' + K(p.ws_price),
          base: p.ws_price * it.qty,
          moq: p.moq,
          moqErr: it.qty < p.moq ? 'MOQ is ' + p.moq + ' cartons' : ''
        });
      }
    } else {
      L.push({ it, name: 'Mix: ' + (it.name || 'My mix'), desc: it.size + 'g', base: it.price });
    }
  }
  const bulkPct = mode === 'retail' ? (u >= S.t2 ? S.d2 : u >= S.t1 ? S.d1 : 0) : 0;
  const activePromo = mode === 'retail' && st.promo && PROMOS[st.promo] ? PROMOS[st.promo] : null;
  const pct = Math.max(bulkPct, activePromo?.pct || 0);

  let nxt = '';
  if (mode === 'retail') {
    if (u < S.t1) nxt = `Add ${S.t1 - u} more pack${S.t1 - u === 1 ? '' : 's'} to unlock ${S.d1}% bulk savings.`;
    else if (u < S.t2) nxt = `Add ${S.t2 - u} more pack${S.t2 - u === 1 ? '' : 's'} to unlock ${S.d2}% bulk savings.`;
  }
  let sub = 0, sav = 0;
  L.forEach(l => {
    const canDisc = l.elig || (activePromo && activePromo.pct);
    l.disc = canDisc ? Math.floor(l.base * pct / 100) : 0;
    l.total = l.base - l.disc;
    sub += l.base;
    sav += l.disc;
  });
  const net = sub - sav;
  const freeShip = mode === 'retail' && (net >= S.free || Boolean(activePromo?.freeShip));
  const fee = L.length ? (freeShip ? 0 : S.deliv) : 0;
  const freeShipGap = mode === 'retail' && !freeShip ? Math.max(0, S.free - net) : 0;
  const freeShipPct = mode === 'retail' ? Math.min(100, Math.round((net / Math.max(1, S.free)) * 100)) : 0;

  return { L, pct, nxt, sub, sav, net, fee, total: net + fee, freeShipGap, freeShipPct, activePromo };
}

  if (st.mode === 'wholesale' && Number(p.moq || 1) > maxQty) return toast('There is not enough stock to meet the wholesale minimum for this product.', true);
  if (ex) {

  } else c.push({ k: 'p', sku, qty: st.mode === 'wholesale' ? Number(p.moq || 1) : 1 });
  live(p.name + ' added to cart');
  render();
}

  if (next < 1) c.splice(i, 1);

  render();
}

}

        </div>
      </section>`
    : `<section class="hero">
        <h1>Good business deserves sweeter margins.</h1>
        <p>Master carton pricing, transparent resale profit calculators, and verified passes for shops, cafés, and event teams.</p>

          <button class="pri" onclick="document.getElementById('cat').scrollIntoView({behavior:'smooth'})">Browse cartons ↗</button>

  h += `<div class="promise-strip">

      <div class="promise"><span class="pi">♡</span><span><b>Made for sharing</b><small>Custom Pick &amp; Mix pouches &amp; gifting</small></span></div>
      <div class="promise"><span class="pi">🔒</span><span><b>Verified QR passes</b><small>Tamper-proof single-use pickup &amp; delivery</small></span></div>
    </div>
    <div class="catalog-head">
      <div><h2>Explore the vault</h2><p>Find your next little joy.</p></div>
      <span class="catalog-count">${ps.length} ${ps.length === 1 ? 'treat' : 'treats'}</span>
    </div>
    <div id="cat" class="panel">
      <div class="row">
        <div style="flex:2 1 160px"><label for="q">Find a treat</label><input id="q" value="${esc(st.q)}" placeholder="Search sweets…" oninput="st.q=this.value;render(true)"></div>
        <div style="flex:1 1 120px"><label for="so">Sort by</label><select id="so" onchange="st.sort=this.value;render()">
          <option value="pop" ${st.sort === 'pop' ? 'selected' : ''}>Availability</option>
          <option value="price" ${st.sort === 'price' ? 'selected' : ''}>Price: low to high</option>
          <option value="new" ${st.sort === 'new' ? 'selected' : ''}>Recently added</option>
        </select></div>
      </div>
      <div class="row" style="margin-top:10px">${cats.map(c => `<button ${c === st.cat ? 'class="pri"' : ''} aria-pressed="${c === st.cat}" onclick="st.cat='${esc(c)}';render()">${esc(c)}</button>`).join('')}</div>
    </div>
    <div class="grid">`;

  if (st.loading && !st.P.length) {
    h += '<div class="empty-products"><div class="empty-icon">🍬</div><h3>Opening the vault…</h3><p>Our sweet collection is being prepared.</p></div>';
  } else if (!ps.length) {
    h += '<div class="empty-products"><div class="empty-icon">🔎</div><h3>No treats found</h3><p>Try another search or choose a different category.</p><button data-clear-filter>Clear filters</button></div>';
  }

  for (const p of ps) {
    const out = p.stock <= 0 || expired(p);
    const unitWs = p.carton ? p.ws_price / p.carton : 0;
    const resaleProfit = p.carton ? (p.price * p.carton) - p.ws_price : 0;
    const marginPct = p.carton && p.price ? Math.round((resaleProfit / (p.price * p.carton)) * 100) : 0;

    h += `<article class="card">${tile(p)}<div class="b">
      <small>${st.mode === 'retail' ? esc(p.cat) : esc(p.sku) + ' · ' + esc(p.cat)}</small>
      <h3><a href="#" data-open-sku="${esc(p.sku)}" style="color:inherit;text-decoration:none">${esc(p.name)}</a></h3>

      ${st.mode === 'retail'
        ? `<b>${K(p.price)}</b>`
        : `<b>${K(p.ws_price)} / carton</b>
           <small>${p.carton} units · ${K(unitWs)}/unit · MOQ ${p.moq}</small>
           <div class="margin-pill">Est. resale profit: +${K(resaleProfit)}/ctn (${marginPct}% margin)</div>`}
      <small class="stockline ${expired(p) ? 'bad' : p.stock <= 20 ? 'warn' : 'ok'}">${expired(p) ? 'Batch expired' : p.stock <= 0 ? 'Out of stock' : p.stock <= 20 ? 'Low stock (' + p.stock + ' left)' : 'In stock · fresh batch'}</small>
      <button class="pri" ${out ? 'disabled' : ''} data-add-sku="${esc(p.sku)}">${st.mode === 'retail' ? 'Add to cart' : 'Add cartons'}</button>
    </div></article>`;
  }
  return h + `</div><div class="note">Ingredient and allergen details are verified per batch — check individual product pages before ordering.</div>`;
}

async function applyWs() {

  const contact = $('#cp').value.trim();
  const phone = $('#bp').value.trim();
  if (name.length < 2 || contact.length < 2) return toast('Enter business name and contact person', true);

  const m = st.mix;

  const pr = (g / 100) * st.S.mix100;
  const chosen = Object.entries(m.items).map(([sku, scoops]) => {
    const p = st.P.find(x => x.sku === sku);

  }).filter(Boolean);

  return `<h2>Pick &amp; Mix Studio</h2>
    <div class="panel">
      <div class="row sp">
        <div class="row">${[500, 1000, 2000].map(s => `<button ${m.size === s ? 'class="pri"' : ''} onclick="st.mix.size=${s};if(${g}>${s})st.mix.items={};render()">${s >= 1000 ? s / 1000 + 'kg' : s + 'g'}</button>`).join('')}</div>

      </div>

      ${chosen.length ? `<p><small>Selected: ${chosen.join(' · ')}</small></p>` : ''}
      <label for="mn">Name your mix</label>
      <input id="mn" maxlength="40" value="${esc(m.name)}" placeholder="e.g. Friday Movie Night Mix" oninput="st.mix.name=this.value">
    </div>
    <div class="grid">
      ${st.P.filter(p => !expired(p) && p.stock > 0).map(p => {
        const n = m.items[p.sku] || 0;
        return `<div class="card"><div class="b">
          <b>${esc(p.name)}</b>
          <small>${n * 100}g selected</small>
          <div class="row">
            <button aria-label="Remove 100g ${esc(p.name)}" ${n <= 0 ? 'disabled' : ''} onclick="mx('${esc(p.sku)}',-1)">−</button>
            <button aria-label="Add 100g ${esc(p.name)}" onclick="mx('${esc(p.sku)}',1)" ${g >= m.size || n >= p.stock ? 'disabled' : ''}>+</button>
          </div>
        </div></div>`;
      }).join('')}
    </div>
    <p class="row">
      <button class="pri" ${g ? '' : 'disabled'} onclick="addMix()">Add mix to cart</button>
      <button ${g ? '' : 'disabled'} onclick="saveRec()">Save recipe</button>
    </p>
    ${st.recipes.length ? '<h3>Saved recipes</h3>' + st.recipes.map((r, i) => `<div class="panel row sp"><span><b>${esc(r.name)}</b> · ${r.size}g</span><button onclick="st.mix={size:${r.size},name:st.recipes[${i}].name,items:{...st.recipes[${i}].items}};render()">Load</button></div>`).join('') : ''}`;
}

function mx(s, d) {
  const m = st.mix;
  const g = Object.values(m.items).reduce((a, b) => a + b, 0) * 100;
  if (d > 0 && g >= m.size) return;
  m.items[s] = Math.max(0, (m.items[s] || 0) + d);
  if (!m.items[s]) delete m.items[s];
  render();
}

async function saveRec() {
  const r = { name: st.mix.name.trim() || 'My mix', size: st.mix.size, items: { ...st.mix.items } };
  if (st.user) {
    const { error } = await sb.from('sv_recipes').insert(r);
    if (error) return toast(error.message, true);
    await loadRec();
    toast('Recipe saved to your account');
  } else {
    st.recipes.push(r);
    localStorage.setItem('sv_rec', JSON.stringify(st.recipes));
    toast('Recipe saved on this device');
  }
  render();
}

function addMix() {
  const m = st.mix;
  const g = Object.values(m.items).reduce((a, b) => a + b, 0) * 100;
  if (!g) return;
  for (const [sku, scoops] of Object.entries(m.items)) {
    const p = st.P.find(x => x.sku === sku);
    if (!p || expired(p) || p.stock < scoops) {
      return toast(`${p ? p.name : sku} no longer has enough stock for this mix`, true);
    }
  }
  st.cart.retail.push({ k: 'm', name: m.name.trim() || 'My mix', size: m.size, grams: g, items: { ...m.items }, price: (g / 100) * st.S.mix100 });
  st.mix = { size: m.size, items: {}, name: '' };
  st.mode = 'retail';
  go('cart');
}

function applyPromoCode() {

  if (!code) {
    st.promo = '';
    localStorage.removeItem('sv_promo');
    render();

  st.promo = code;
  localStorage.setItem('sv_promo', code);
  toast(`Applied ${code}: ${PROMOS[code].label}`);

    (r.nxt ? `<div class="note">${esc(r.nxt)}</div>` : r.pct ? `<div class="note ok">${r.pct}% discount applied</div>` : '') +
    (st.mode === 'retail' ? `<div class="panel">
      <label for="promoin">Promo code</label>
      <div class="row">
        <input id="promoin" value="${esc(st.promo)}" placeholder="e.g. SWEET10" style="flex:1 1 160px;text-transform:uppercase">
        <button type="button" onclick="applyPromoCode()">${st.promo ? 'Update' : 'Apply'}</button>

      ${r.sav ? `<div class="row sp ok"><span>Savings (${r.pct}%)</span><span>−${K(r.sav)}</span></div>` : ''}

async function place() {
  if (st.busy) return;
  const rl = checkRateLimit('place_order', 4, 60000);
  if (rl) return toast(rl, true);

  Object.assign(ck, {
    name: $('#cn').value.trim(),
    phone: $('#cph').value.trim(),
    addr: $('#ca').value.trim(),
    gift: $('#cgift')?.value.trim() || '',
    del: $('#cd').value,
    pay: $('#cp2').value
  });
  if (ck.name.length < 2) return toast('Enter your full name', true);
  if (ck.phone.replace(/\D/g, '').length < 9) return toast('Enter a valid Kenyan phone number', true);
  if (ck.del === 'delivery' && ck.addr.length < 3) return toast('Enter your delivery address', true);

  const items = st.cart[st.mode].map(i => i.k === 'p' ? { k: 'p', sku: i.sku, qty: i.qty } : { k: 'm', name: i.name, size: i.size, items: i.items });
  const fullAddr = ck.gift ? `${ck.addr || 'Pickup'} [Gift Note: ${ck.gift}]` : ck.addr;

  st.busy = true;
  const placeButton = $('#plc');
  if (placeButton) { placeButton.disabled = true; placeButton.textContent = 'Placing order…'; }
  try {
    const { data, error } = await sb.rpc('sv_place_order', {
      p_items: items,
      p_mode: st.mode,
      p_cust: { name: ck.name, phone: ck.phone, addr: fullAddr, del: ck.del, pay: ck.pay }
    });
    if (error) throw error;
    if (!data || typeof data !== 'object' || !data.ref) throw new Error('The server returned an incomplete order confirmation. Please check My Vault or Track before trying again.');
    st.last = { ...data, mode: st.mode };
    st.cart[st.mode] = [];
    await Promise.all([loadShop(), loadOrders()]);
    go('done');
  } catch (error) {
    console.error('SweetVault order placement failed:', error);
    toast(error?.message || 'Order could not be placed. Please try again.', true);
    if (placeButton) { placeButton.disabled = false; placeButton.textContent = 'Place order'; }
  } finally {
    st.busy = false;
  }
}

function qrSvg(t) {
  if (!t || typeof qrcode !== 'function') return '';
  try {
    const q = qrcode(0, 'M');
    q.addData(String(t));
    q.make();
    return q.createSvgTag({ scalable: true, margin: 0 });
  } catch (error) {
    console.error('SweetVault QR generation failed:', error);
    return '';
  }
}

function passCard(ref, tok, status, pay, total, redeemed) {
  return `<div class="panel pass">
    <h3>${esc(ref)}</h3>
    <small>${esc(status)} · ${esc(pay)} · ${K(total)}</small>
    ${tok ? `<div class="qr" role="img" aria-label="Order pass QR code for ${esc(ref)}">${qrSvg(tok)}</div>` : '<p class="warn">Pass QR is not available yet. Please refresh My Vault or contact support.</p>'}
    <p><b class="${redeemed ? 'bad' : 'ok'}">${redeemed ? 'REDEEMED' : 'Show at pickup / delivery'}</b></p>
    <small>Single-use cryptographic pass. Verified on the server.</small>
  </div>`;
}

function done() {
  const o = st.last;
  if (!o) return '';
  const shareUrl = `${window.location.origin}${window.location.pathname}?ref=${encodeURIComponent(o.ref)}`;
  const waMsg = `SweetVault Order ${o.ref}\n${o.lines.map(l => l.name + ' x' + (l.qty || l.cartons || '')).join('\n')}\nTotal: ${K(o.total)}\nTry SweetVault: ${shareUrl}`;
  return `<h2>Order confirmed</h2>
    <p class="ok">Reference ${esc(o.ref)}</p>
    ${o.pay_status === 'paid_simulated' ? '<p>Payment is <b>simulated</b>.</p>' : '<p class="warn">Payment pending.</p>'}

      <a href="https://wa.me/?text=${encodeURIComponent(waMsg)}" target="_blank" rel="noopener noreferrer"><button class="pri">Share on WhatsApp</button></a>

  return `<h2>My Vault</h2>

      <div class="row">
        <input readonly value="${esc(refLink)}" style="flex:1 1 200px;font-size:13px">
        <button type="button" class="pri" onclick="navigator.clipboard?.writeText('${esc(refLink)}');toast('Referral link copied!')">Copy link</button>
      </div>
    </div>` +
    (st.orders.length
      ? st.orders.map(o => {
          const p = o.sv_order_passes?.[0] || o.sv_order_passes;

            `<p class="row" style="justify-content:center"><button onclick="reorder('${esc(o.id)}')">Reorder</button><button onclick="printDoc('${esc(o.id)}','invoice')">Invoice</button></p>`;
        }).join('')
      : '<p>No orders yet.</p>');

function reorder(id) {
  const o = st.orders.find(x => x.id === id);
  if (!o) return;
  const mode = o.type;
  if (mode === 'wholesale' && !wsOK()) return toast('Wholesale account not approved', true);
  let n = 0;
  for (const l of o.lines || []) {
    if (!l.sku || !st.P.find(p => p.sku === l.sku)) continue;
    const q = l.qty || l.cartons;
    const c = st.cart[mode];
    const ex = c.find(i => i.k === 'p' && i.sku === l.sku);
    ex ? ex.qty += q : c.push({ k: 'p', sku: l.sku, qty: q });
    n++;
  }
  if (!n) return toast('Nothing to reorder (custom mixes are not reordered here)', true);
  st.mode = mode;
  go('cart');
}

async function scan() {
  if (!('BarcodeDetector' in window)) return toast('Camera scanning is not supported in this browser. Enter the code manually.', true);
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  } catch (_) {
    return toast('Camera permission denied. Enter the code manually.', true);
  }
  const v = document.createElement('video');
  v.srcObject = stream;
  v.setAttribute('playsinline', '');
  v.style.width = '100%';
  v.style.borderRadius = '12px';
  $('#cam').innerHTML = '';
  $('#cam').append(v);
  try { await v.play(); }
  catch (_) { stream.getTracks().forEach(t => t.stop()); $('#cam').innerHTML = ''; return toast('Could not start the camera preview. Enter the code manually.', true); }
  let d;
  try { d = new BarcodeDetector({ formats: ['qr_code'] }); }
  catch (_) { stream.getTracks().forEach(t => t.stop()); $('#cam').innerHTML = ''; return toast('QR scanning is unavailable. Enter the code manually.', true); }
  let stopped = false;
  const stop = () => {
    if (stopped) return;
    stopped = true;
    stream.getTracks().forEach(t => t.stop());
    const c = $('#cam');
    if (c) c.innerHTML = '';
  };
  const tick = async () => {
    if (!v.isConnected) return stop();
    try {
      const r = await d.detect(v);
      if (r[0]) {
        $('#rf').value = r[0].rawValue;
        stop();
        return redeem();
      }
    } catch (_) {}
    requestAnimationFrame(tick);
  };
  tick();
}

  const row = {
    sku: g('sku').toUpperCase(),
    name: g('name'),
    cat: g('cat'),
    price: n('price'),
    carton: n('carton'),
    moq: n('moq'),
    ws_price: n('ws'),
    stock: n('stock'),
    batch: g('batch') || null,
    bb: g('bb') || null,
    diet: g('diet') ? g('diet').split(',').map(x => x.trim()).filter(Boolean) : [],
    description: g('desc') || null,
    image_url: imgUrl || null,
    active: true
  };
  if (!row.sku || !row.name || !row.cat) return toast('SKU, name, and category are required', true);
  if (!Number.isFinite(row.price) || row.price < 0 || !Number.isFinite(row.ws_price) || row.ws_price < 0 || !Number.isFinite(row.stock) || row.stock < 0) {
    return toast('Check price, carton, and stock numbers', true);
  }
  let { error } = await sb.from('sv_products').insert(row);
  let imageFieldMissing = false;

    delete row.image_url;
    const retry = await sb.from('sv_products').insert(row);
    if (retry.error) return toast(retry.error.message, true);
    imageFieldMissing = true;
  } else if (error) {
    return toast(error.message, true);
  }
  await loadShop();
  toast(imageFieldMissing ? 'Product added. Run the image setup SQL to save pictures.' : 'New treat added: ' + row.sku);
  render();

function passwordFeedback() {
  const p = $('#pw'), bar = $('#pwm'), hint = $('#pwhint');
  if (!p || !bar || !hint) return;
  const v = p.value;
  let score = 0;
  if (v.length >= 8) score++;
  if (v.length >= 12) score++;
  if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
  if (/[0-9]/.test(v) || /[^A-Za-z0-9]/.test(v)) score++;
  bar.style.width = (score * 25) + '%';
  bar.style.background = score >= 4 ? 'var(--mint)' : score >= 2 ? 'var(--amber)' : 'var(--berry)';
  hint.textContent = !v ? 'Use 8+ characters. A longer passphrase is even better.' : score < 2 ? 'Try a longer password.' : score < 4 ? 'Good start. Make it longer and less predictable.' : 'Strong length and variety. Avoid reusing this password.';
}

async function withAuthBusy(task) {

  st.authBusy = true;
  const submit = document.querySelector('.auth-panel form button[type="submit"]');
  if (submit) { submit.disabled = true; submit.textContent = 'Please wait…'; }
  try { await task(); }
  catch (error) {
    console.error('SweetVault account action failed:', error);
    toast(error?.message || 'Something went wrong. Please try again.', true);
  } finally {
    st.authBusy = false;
    if (st.view === 'account') render();
  }
}

async function auth(k) {
  const rl = checkRateLimit('auth_' + k, 5, 60000);
  if (rl) return toast(rl, true);
  return withAuthBusy(async () => {
    const email = ($('#em')?.value || '').trim().toLowerCase();
    if (!email || email.length > 254 || !/^\S+@\S+\.\S+$/.test(email)) return toast('Enter a valid email address', true);

    if (k === 'reset') {
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
      if (error) throw error;
      resetRateLimit('auth_reset');
      st.authMode = 'in'; render();
      return toast('If an account exists for this email, a password reset link has been sent.');
    }

    const password = $('#pw')?.value || '';
    if (password.length < 8) return toast('Password must be at least 8 characters', true);

    if (k === 'recovery') {
      if (password !== ($('#pwc')?.value || '')) return toast('The passwords do not match', true);
      const { error } = await sb.auth.updateUser({ password });
      if (error) throw error;
      resetRateLimit('auth_recovery');
      st.authMode = 'in'; st.view = 'account';
      toast('Your password has been updated successfully.');
      return;
    }

    if (k === 'up') {
      const name = ($('#an')?.value || '').trim();
      const phone = ($('#aph')?.value || '').trim();
      if (name.length < 2 || name.length > 100) return toast('Enter your full name (2–100 characters)', true);
      if (phone.replace(/\D/g, '').length < 9) return toast('Enter a valid phone number', true);
      if (password !== ($('#pwc')?.value || '')) return toast('The passwords do not match', true);
      if (!$('#termsok')?.checked) return toast('Please accept the Terms and acknowledge the Privacy Policy', true);
      const now = new Date().toISOString();
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: {
        app: 'sweetvault', full_name: name, phone, referred_by: sessionStorage.getItem('sv_ref') || null,
        terms_accepted_at: now, privacy_notice_acknowledged_at: now
      } } });
      if (error) throw error;
      resetRateLimit('auth_up');
      if (!data.session) {
        st.authMode = 'in'; render();
        return toast('Account created. Check your email for the confirmation link, then sign in.');
      }
      st.authMode = 'in'; st.view = 'shop';
      toast('Welcome to SweetVault, ' + name.split(/\s+/)[0] + '!');
      return;
    }

    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    resetRateLimit('auth_in');
    st.authMode = 'in'; st.view = 'shop';
  });
}

async function saveProfile() {
  if (!st.user || st.authBusy) return;
  const name = ($('#profileName')?.value || '').trim();
  const phone = ($('#profilePhone')?.value || '').trim();
  if (name.length < 2 || name.length > 100) return toast('Enter your full name (2–100 characters)', true);
  if (phone && phone.replace(/\D/g, '').length < 9) return toast('Enter a valid phone number', true);
  return withAuthBusy(async () => {
    const { error } = await sb.auth.updateUser({ data: { full_name: name, phone } });
    if (error) throw error;
    toast('Your account details have been saved.');
  });
}

async function changeAccountPassword() {
  if (!st.user || st.authBusy) return;
  const password = $('#newAccountPassword')?.value || '';
  const confirm = $('#confirmAccountPassword')?.value || '';
  if (password.length < 8) return toast('Password must be at least 8 characters', true);
  if (password !== confirm) return toast('The passwords do not match', true);
  return withAuthBusy(async () => {
    const { error } = await sb.auth.updateUser({ password });

    toast('Your password has been updated.');

async function signOutUser() {
  try {
    const { error } = await sb.auth.signOut();

    console.error('SweetVault sign-out failed:', error);

async function claim() {

const TR = { await_payment: 'confirmed', awaiting_payment: 'confirmed', confirmed: 'packing', packing: 'out_for_delivery', out_for_delivery: 'delivered' };
async function adv(ref, to) {

async function redeem() {
  const { data, error } = await sb.rpc('sv_redeem', { p_code: $('#rf').value.trim() });

  if (error) { m.textContent = error.message; m.className = 'bad'; return; }

const prodKey = sku => String(sku).replace(/[^a-zA-Z0-9_-]/g, '_');

async function saveProduct(sku) {
  const k = prodKey(sku);
  const val = id => document.getElementById('ed-' + k + '-' + id)?.value?.trim() || '';
  const num = id => Number(val(id));
  const imgUrl = val('image');
  if (imgUrl && !isSafeHttpsUrl(imgUrl)) return toast('Product image URL must use HTTPS', true);

  const row = {
    name: val('name'),
    cat: val('cat'),
    price: num('price'),
    carton: num('carton'),
    moq: num('moq'),
    ws_price: num('ws'),
    stock: num('stock'),
    batch: val('batch') || null,
    bb: val('bb') || null,
    diet: val('diet') ? val('diet').split(',').map(x => x.trim()).filter(Boolean) : [],
    description: val('desc') || null,
    image_url: imgUrl || null
  };
  if (!row.name || !row.cat) return toast('Product name and category are required', true);
  if (!Number.isFinite(row.price) || row.price < 0 || !Number.isFinite(row.stock) || row.stock < 0 || !Number.isFinite(row.ws_price) || row.ws_price < 0) {
    return toast('Check price and stock values', true);
  }
  let { error } = await sb.from('sv_products').update(row).eq('sku', sku);
  let imageFieldMissing = false;
  if (error && /image_url|column/i.test(error.message)) {
    delete row.image_url;
    const retry = await sb.from('sv_products').update(row).eq('sku', sku);
    error = retry.error;
    imageFieldMissing = !error;
  }
  if (error) return toast(error.message, true);
  await loadShop();
  toast(imageFieldMissing ? 'Product details saved. Run the image setup SQL to save pictures.' : 'Product updated: ' + sku);
  render();
}

async function uploadProductImage(sku, file) {
  if (!file) return;
  const allowed = ['image/jpeg', 'image/png', 'image/webp', 'image/avif'];
  if (!allowed.includes(file.type)) return toast('Only JPEG, PNG, WebP, or AVIF images are allowed', true);
  if (file.size > 5 * 1024 * 1024) return toast('Image must be 5 MB or smaller', true);
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
  const path = 'products/' + encodeURIComponent(sku) + '-' + Date.now() + '.' + (ext || 'jpg');
  toast('Uploading image…');
  const { error } = await sb.storage.from('product-images').upload(path, file, { upsert: true, contentType: file.type });
  if (error) return toast('Image upload failed: ' + error.message, true);
  const { data } = sb.storage.from('product-images').getPublicUrl(path);
  const k = prodKey(sku);
  const field = document.getElementById('ed-' + k + '-image');
  if (field) field.value = data.publicUrl;
  const preview = document.getElementById('ed-' + k + '-preview');
  if (preview) { preview.src = data.publicUrl; preview.style.visibility = 'visible'; }
  toast('Image uploaded. Tap Save product to publish it.');
}

async function setPricing() {
  const v = $('#tiercfg').value.split('/').map(Number);
  if (v.length !== 4 || v.some(x => !Number.isFinite(x))) return toast('Format: t1/d1/t2/d2 (e.g. 10/15/50/30)', true);
  if (v[0] < 1 || v[2] <= v[0] || v[1] < 0 || v[1] > 90 || v[3] < 0 || v[3] > 90) return toast('Use positive increasing unit thresholds and discounts between 0% and 90%.', true);
  const val = { ...st.S, t1: v[0], d1: v[1], t2: v[2], d2: v[3] };
  const { error } = await sb.from('sv_settings').update({ value: val }).eq('key', 'pricing');
  if (error) return toast(error.message, true);
  st.S = val;
  toast('Pricing updated');
  render();
}

function render(keep) {
  try { localStorage.setItem('sv_cart', JSON.stringify(st.cart)); }
  catch (error) { console.warn('SweetVault could not persist the cart on this device:', error); }
  document.body.className = st.mode === 'wholesale' ? 'ws' : '';
  $('#mode').textContent = st.mode === 'retail' ? 'Wholesale' : 'Retail';

  const cart = st.cart[st.mode];
  const totalQty = cart.reduce((n, x) => n + (x.qty || 1), 0);
  $('#cartb').textContent = `Cart (${totalQty})`;

  const tabs = [
    ['shop', 'Shop'],
    ['mix', 'Pick & Mix'],
    ['cart', 'Cart'],
    ['pass', 'My Vault'],
    ['track', 'Track'],
    ['account', st.user ? 'Account' : 'Sign in']
  ];
  if (isStaff()) tabs.push(['admin', 'Admin']);
  $('#nav').innerHTML = tabs.map(a => `<button ${st.view === a[0] ? 'aria-current="true"' : ''} onclick="go('${a[0]}')">${a[1]}</button>`).join('');

  const views = {
    shop, mix: mixV, cart: cartV, checkout: ckV, done, admin: adm,
    pass: vault, account, prod: prodV, info, track: trackV
  };
  const v = views[st.view] || shop;

  const active = document.activeElement;
  const activeId = active && active.id ? active.id : null;
  const isTextInput = active && ['INPUT', 'TEXTAREA'].includes(active.tagName) && !['checkbox', 'radio', 'file'].includes(active.type);
  const pos = isTextInput ? active.selectionStart : null;

  $('#app').innerHTML = v();

  const priced = price(cart, st.mode);
  const qc = $('#quickcart');
  const unitLabel = st.mode === 'wholesale'
    ? `${totalQty} carton${totalQty === 1 ? '' : 's'}`
    : `${totalQty} item${totalQty === 1 ? '' : 's'}${priced.freeShipGap > 0 ? ` · ${K(priced.freeShipGap)} to free delivery` : ' · Free delivery!'}`;
  qc.innerHTML = (totalQty && ['shop', 'mix'].includes(st.view))
    ? `<div class="quickcart-inner"><div><span class="qc-label">${unitLabel}</span><span class="qc-total">${K(priced.total)}</span></div><button onclick="go('cart')">View cart&nbsp; ↗</button></div>`
    : '';

  if (keep && activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (isTextInput && pos !== null) {
        try { el.setSelectionRange(pos, pos); } catch (_) {}
      }
    }
  }
}

document.addEventListener('click', e => {
  if (e.target.closest('[data-clear-filter]')) {
    st.q = '';
    st.cat = 'All';
    render();
    return;
  }
  const add = e.target.closest('[data-add-sku]');
  if (add) {
    addP(add.dataset.addSku);
    return;
  }
  const open = e.target.closest('[data-open-sku]');
  if (open) {
    e.preventDefault();
    openP(open.dataset.openSku);
    return;
  }
  const save = e.target.closest('[data-save-sku]');
  if (save) {
    saveProduct(save.dataset.saveSku);
    return;
  }
  const arch = e.target.closest('[data-archive-sku]');
  if (arch) {
    archive(arch.dataset.archiveSku);
  }
});

document.addEventListener('change', e => {
  const up = e.target.closest('[data-upload-sku]');
  if (up && up.files && up.files[0]) {
    uploadProductImage(up.dataset.uploadSku, up.files[0]);
  }
});

boot().catch(error => {
  console.error('SweetVault startup failed:', error);
  const app = document.querySelector('#app');
  if (app) app.innerHTML = '<section class="panel"><h2>SweetVault could not start</h2><p>Please check your internet connection and reload. If the problem continues, contact support.</p></section>';
  const live = document.querySelector('#live');
  if (live) live.textContent = 'SweetVault could not start. Please reload the page.';
});
